<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Lean Bulk Log</title>
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><main id="view"></main></div>

  <button id="fab" data-act="open-add" aria-label="Add food" hidden>
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav id="tabbar">
    <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg><span>Today</span></button>
    <button data-act="tab" data-tab="train"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Train</span></button>
    <button data-act="tab" data-tab="history"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-7"/></svg><span>History</span></button>
    <button data-act="tab" data-tab="foods"><svg viewBox="0 0 24 24"><path d="M8 4v16M4 4v6a4 4 0 0 0 4 4M12 4v6a4 4 0 0 1-4 4M18 4c-2 2-2.5 5-2.5 8H18v8"/></svg><span>Foods</span></button>
    <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span></button>
  </nav>

  <input type="file" id="scan-file" accept="image/*" capture="environment" hidden>
  <input type="file" id="scan-file-gallery" accept="image/*" hidden>
  <div id="layers"></div>
  <div id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
